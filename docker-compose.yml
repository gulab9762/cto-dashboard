version: "3.9"

services:
  # Message Queue
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      REDPANDA_ADVERTISE_KAFKA_API: redpanda:29092

  # Metrics Database
  postgres:
    image: postgres:15
    container_name: postgres1
    environment:
      POSTGRES_DB: cto_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Analytics Database
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: cto_dashboard
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - ./config/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Integration Service (Webhook handler)
  integration-service:
    build:
      context: ./integration-service-java
      dockerfile: Dockerfile
    container_name: integration-service
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      KAFKA_BROKERS: redpanda:29092
      KAFKA_TOPIC: engineering-events
    depends_on:
      redpanda:
        condition: service_started
    networks:
      - cto-network

  # Event Processor (Java Kafka consumer)
  event-processor-java:
    build:
      context: ./event-processor-java
      dockerfile: Dockerfile
    container_name: event-processor-java
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      KAFKA_BROKERS: "redpanda:29092"
      KAFKA_TOPIC: "engineering-events"
      DATABASE_URL: "jdbc:postgresql://postgres:5432/cto_dashboard"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "postgres"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: "cto_dashboard"
    depends_on:
      redpanda:
        condition: service_started
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # API Gateway (Java)
  api-gateway-java:
    build:
      context: ./api-gateway-java
      dockerfile: Dockerfile
    container_name: api-gateway-java
    ports:
      - "4000:4000"
    environment:
      SERVER_PORT: "4000"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/cto_dashboard"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "postgres"
      CLICKHOUSE_URL: "jdbc:ch://clickhouse:8123/cto_dashboard"
      CLICKHOUSE_USERNAME: "default"
      CLICKHOUSE_PASSWORD: ""
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

volumes:
  postgres_data:
  clickhouse_data:

networks:
  cto-network:
    driver: bridge
