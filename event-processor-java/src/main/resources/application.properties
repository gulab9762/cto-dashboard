server.port=${PORT:3001}

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cto_dashboard}
# Assume auth might be in DATABASE_URL or provided separately.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka Configuration
spring.kafka.consumer.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:event-processor-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.client-id=${KAFKA_CLIENT_ID:cto-event-processor}

# ClickHouse Configuration
clickhouse.host=${CLICKHOUSE_HOST:localhost}
clickhouse.port=${CLICKHOUSE_PORT:8123}
clickhouse.user=${CLICKHOUSE_USER:default}
clickhouse.password=${CLICKHOUSE_PASSWORD:}
clickhouse.database=${CLICKHOUSE_DATABASE:cto_dashboard}

# Topic Configuration
kafka.topic.events=${KAFKA_TOPIC:engineering-events}

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
