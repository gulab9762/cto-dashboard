server:
  port: 4000
spring:
  application:
    name: api-gateway
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: false

  # Data source will be configured properly when connected to actual database
  # For now, we mock responses but include dependency and some placeholder config to prevent context load failure
  datasource:
    url: jdbc:postgresql://localhost:5432/cto_dashboard
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  web:
    cors:
          allowed-origins: "*"
          allowed-methods: "*"
          allowed-headers: "*"
          allow-credentials: false

clickhouse:
  url: jdbc:ch://localhost:8123/cto_dashboard
  username: default
  password: ""
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
