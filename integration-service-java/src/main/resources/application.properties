server.port=3000

# Application
spring.application.name=integration-service

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092,localhost:29092}
spring.kafka.producer.client-id=${KAFKA_CLIENT_ID:cto-dashboard}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.retries=10

# Logging
logging.level.org.springframework.kafka=INFO
logging.level.com.dashboard.integration=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Server Concurrency
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:20}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:10000}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:1000}
# Balanced concurrency for 300 VU spike

# Kafka Producer Tuning
spring.kafka.producer.properties.linger.ms=${KAFKA_LINGER_MS:5}
spring.kafka.producer.properties.batch.size=${KAFKA_BATCH_SIZE:16384}
spring.kafka.producer.properties.buffer.memory=${KAFKA_BUFFER_MEMORY:33554432}
spring.kafka.producer.compression-type=${KAFKA_COMPRESSION_TYPE:none}
